project:
  name: "synthetic-image-detection"
  classes: ["REAL", "FAKE"]
  num_classes: 2
  seed: 42

datasets:
  cifake:
    root_dir: "data/raw/cifake"
    processed_dir: "data/processed/cifake"
    image_size: 32
    jpeg_quality: 90
    val_fraction: 0.1
  artifact:
    root_dir: "data/raw/artifact"
    processed_dir: "data/processed/artifact"
    image_size: 200
    jpeg_quality: 90

training:
  device: "cuda"
  mixed_precision: true
  batch_size: 128
  epochs: 30
  learning_rate: 0.001
  weight_decay: 0.0001
  warmup_epochs: 1
  label_smoothing: 0.0
  num_workers: 6
  early_stopping_patience: 5
  limit: null

models:
  mlp:
    hidden_dims: [512, 256, 128]
    dropout: 0.3
    pool: 1
    by_dataset:
      artifact: {pool: 4}
    weights_path: "weights/mlp.pt"
    onnx_path: "weights/mlp.onnx"
  cnn:
    base_channels: 32
    dropout: 0.4
    weights_path: "weights/cnn.pt"
    onnx_path: "weights/cnn.onnx"
  resnet18:
    pretrained: true
    freeze_backbone: false
    dropout: 0.3
    weights_path: "weights/resnet18.pt"
    onnx_path: "weights/resnet18.onnx"
